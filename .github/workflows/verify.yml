name: Verify arcade
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: git diff --exit-code -- sw.js
      - run: npm test
      - run: python tests/frame_budget_browser.py
      - run: python tests/production_browser_check.py
      - run: python tests/pwa_check.py
      - run: python tests/audio_audit.py
      - run: python tests/audio_plot.py
      - run: python tests/visual_audit.py
      - run: python tests/polish_fuzz.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcade-verification
          path: test-results/arcade/
