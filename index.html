<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121c39">
  <meta name="description" content="두 버튼으로 하늘 위 블록 계단을 오르는 우주 블록 런">
  <title>우주 블록 런</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <main id="viewport">
    <div id="game" aria-label="우주 블록 런">
      <canvas id="scene" width="720" height="1280" role="img" aria-label="하늘 위 블록 계단과 캐릭터"></canvas>
      <output id="score" class="sr-only" aria-live="off">계단 0, 코인 0, 콤보 0</output>
      <button id="turn" class="control control-turn" type="button" aria-label="방향 전환"></button>
      <button id="climb" class="control control-climb" type="button" aria-label="오르기"></button>
    </div>
  </main>
</body>
</html>
